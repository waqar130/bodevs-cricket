    <path d="M80 60 L86 80 L74 76 Z"/><path d="M120 60 L114 80 L126 76 Z"/>
    <path d="M43 92 L66 100 L44 106 Z"/><path d="M157 92 L134 100 L156 106 Z"/>
    <path d="M47 112 L64 116 L50 122 Z"/><path d="M153 112 L136 116 L150 122 Z"/>
