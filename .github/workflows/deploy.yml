name: Sync scores and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"        # Monday 9:00 AM Pakistan time: full weekly sync
    - cron: "*/30 17-21 * * 0" # Sunday 10 PM - 2:30 AM Pakistan time: refresh during match night
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync from Scorecard
        if: github.event_name != 'push'
        run: node sync.js

      - name: Commit synced data
        if: github.event_name != 'push'
        run: |
          git config user.name "bodevs-cricket-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          if git diff --cached --quiet; then
            echo "No new scores."
          else
            git commit -m "Sync scores $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Build site
        run: node build.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
